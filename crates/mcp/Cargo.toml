[package]
name = "braille-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Braille text browser"

[lints]
workspace = true

[[bin]]
name = "braille-mcp"
path = "src/main.rs"

[dependencies]
braille-wire = { path = "../wire" }
rmcp = { version = "1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
