[package]
name = "braille-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing Braille browser as tools for AI agents"

[lints]
workspace = true

[[bin]]
name = "braille-mcp"
path = "src/main.rs"

[dependencies]
braille-wire = { path = "../wire" }
braille-client = { path = "../client" }
rmcp = { version = "1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
