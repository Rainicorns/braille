[package]
name = "braille-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
braille-wire = { path = "../wire" }
rquickjs = { version = "0.11", features = ["macro", "loader"] }
html5ever = "0.38"
markup5ever = "0.38"
tendril = "0.5"
cssparser = "0.35"
selectors = "0.28"
precomputed-hash = "0.1"
url = "2.5"
quick-xml = "0.37"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
ring = "0.17"
sha2 = { version = "0.10", features = ["oid"] }
getrandom = "0.2"
argon2 = "0.5"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
x448 = { version = "0.14.0-pre.8", features = ["static_secrets"] }
ed448-goldilocks = { version = "0.14.0-pre.11", features = ["signing"] }
sha3 = "0.10"
ml-kem = { version = "0.3.0-rc.1", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ml-dsa = "0.1.0-rc.8"
aes-kw = "0.3.0-rc.2"
taffy = "0.7"
wasmtime = { version = "43", default-features = false, features = ["runtime", "cranelift", "std"] }

[features]
real-sites = []

[lints]
workspace = true

[[bin]]
name = "braille-engine"
path = "src/bin/braille_engine.rs"

[[bin]]
name = "braille-worker"
path = "src/bin/braille_worker.rs"

[dev-dependencies]
libtest-mimic = "0.8"
criterion = "0.5"
reqwest = { version = "0.12", features = ["blocking"] }

[[bench]]
name = "engine_bench"
harness = false

[[test]]
name = "html5lib_tree_construction"
harness = false

[[test]]
name = "html5lib_serializer"
harness = false

